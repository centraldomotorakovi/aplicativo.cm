<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central do Motorista — Atendimento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f9fafb 0%, #f1f3f5 100%);
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), 0 5px 15px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .brand-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-logo {
            width: 120px;
            height: 120px;
            object-fit: contain; /* Garante que a foto NÃO seja distorcida ou esticada */
            background-color: transparent;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: #718096;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.25s ease-in-out;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn-highlight {
            background-color: #f92a54;
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(249, 42, 84, 0.25);
        }

        .btn-highlight:hover {
            background-color: #d61f43;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(249, 42, 84, 0.35);
        }

        .btn-outline {
            background-color: #ffffff;
            color: #374151;
            border: 2px solid #e5e7eb;
        }

        .btn-outline:hover {
            background-color: #fff5f6;
            color: #f92a54;
            border-color: #fca5b5;
            transform: translateY(-2px);
        }

        .action-btn i {
            font-size: 18px;
            width: 30px;
            text-align: left;
        }

        .action-btn .btn-text {
            flex-grow: 1;
            text-align: left;
        }

        .action-btn .arrow-icon {
            font-size: 12px;
            opacity: 0.5;
            text-align: right;
            width: auto;
        }

        .footer-text {
            margin-top: 35px;
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
        }

        .whatsapp-floating {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            z-index: 999;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .whatsapp-floating:hover {
            background-color: #20ba5a;
            transform: scale(1.1) rotate(5deg);
        }

        .whatsapp-floating::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #25d366;
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
            animation: pulse-effect 2s infinite;
        }

        @keyframes pulse-effect {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="brand-container">
            <!-- Puxando a foto localmente para garantir o carregamento sem erros externos -->
            <img src="logo.png" alt="Central do Motorista" class="brand-logo">
        </div>
        
        <h1>Central do Motorista</h1>
        <p class="subtitle">Suporte Profissional Integrado</p>

        <div class="action-list">
            <a href="https://wa.me/5511960536684?text=Ol%C3%A1%2C%20preciso%20de%20ajuda%20com%20meu%20desconto." target="_self" class="action-btn btn-highlight">
                <i class="fas fa-percentage"></i>
                <span class="btn-text">Problema com desconto? Falar com Especialista</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://wa.me/5511960536684?text=Ol%C3%A1%2C%20gostaria%20da%20segunda%20via." target="_self" class="action-btn btn-outline">
                <i class="fas fa-file-invoice-dollar"></i>
                <span class="btn-text">Solicitar Segunda Via</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://wa.me/5511960536684?text=Ol%C3%A1%2C%20preciso%20de%20acesso%20ao%20portal%20do%20cliente." target="_self" class="action-btn btn-outline">
                <i class="fas fa-user-shield"></i>
                <span class="btn-text">Acessar Portal do Cliente</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://wa.me/5511960536684?text=Ol%C3%A1%2C%20gostaria%20de%20falar%20com%20a%20central%20do%20motorista." target="_self" class="action-btn btn-outline">
                <i class="fas fa-id-card"></i>
                <span class="btn-text">Central do Motorista Kovi</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <p class="footer-text">Atendimento oficial realizado via WhatsApp.</p>
    </div>

    <a href="https://wa.me/5511960536684" class="whatsapp-floating" target="_self" title="Fale Conosco">
        <i class="fab fa-whatsapp"></i>
    </a>

</body>
</html>
